name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate splash screens (full-screen per device)
        run: npx capacitor-assets generate --android

      - name: Generate unified launcher icon + notification icon
        run: node scripts/generate-icons.cjs && node scripts/update-adaptive.cjs

      - name: Apply native fixes (locked WebView, no dynamic icons)
        run: node scripts/apply-native-fixes.cjs

      - name: Set localized app name (Arabic default / English)
        run: |
          cat > android/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">حِصن</string>
              <string name="title_activity_main">حِصن</string>
              <string name="package_name">com.hissn.azkar</string>
              <string name="custom_url_scheme">com.hissn.azkar</string>
          </resources>
          EOF
          mkdir -p android/app/src/main/res/values-en
          cat > android/app/src/main/res/values-en/strings.xml <<'EOF'
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">Hissn</string>
              <string name="title_activity_main">Hissn</string>
              <string name="package_name">com.hissn.azkar</string>
              <string name="custom_url_scheme">com.hissn.azkar</string>
          </resources>
          EOF

      - name: Add custom notification sound
        run: |
          mkdir -p android/app/src/main/res/raw
          cp sounds/hissn_notif.wav android/app/src/main/res/raw/hissn_notif.wav
          ls android/app/src/main/res/raw/

      - name: Build APK (signed with debug key)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hissn-apk
          path: android/app/build/outputs/apk/debug/*.apk
